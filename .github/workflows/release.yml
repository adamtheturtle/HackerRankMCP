name: Release

on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - name: Validate and test
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -Fq "public let hackerRankMCPVersion = \"$version\"" Sources/HackerRankMCP/ReleaseVersion.swift
          swift test
      - name: Build macOS universal executable
        run: |
          swift build -c release --arch arm64 --scratch-path .build-arm64
          swift build -c release --arch x86_64 --scratch-path .build-x86_64
          mkdir -p dist/hackerrank-mcp-${GITHUB_REF_NAME}-macos-universal
          lipo -create \
            .build-arm64/arm64-apple-macosx/release/hackerrank-mcp \
            .build-x86_64/x86_64-apple-macosx/release/hackerrank-mcp \
            -output dist/hackerrank-mcp-${GITHUB_REF_NAME}-macos-universal/hackerrank-mcp
          cp LICENSE README.md dist/hackerrank-mcp-${GITHUB_REF_NAME}-macos-universal/
          tar -C dist -czf dist/hackerrank-mcp-${GITHUB_REF_NAME}-macos-universal.tar.gz hackerrank-mcp-${GITHUB_REF_NAME}-macos-universal
          shasum -a 256 dist/*.tar.gz > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
