name: Release

on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Validate and test
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -Fq "public let hackerRankMCPVersion = \"$version\"" Sources/HackerRankMCP/ReleaseVersion.swift
          swift test
      - name: Build Linux executable
        run: |
          swift build -c release --static-swift-stdlib
          mkdir -p dist/hackerrank-mcp-${GITHUB_REF_NAME}-linux-x86_64
          cp .build/release/hackerrank-mcp LICENSE README.md dist/hackerrank-mcp-${GITHUB_REF_NAME}-linux-x86_64/
          tar -C dist -czf dist/hackerrank-mcp-${GITHUB_REF_NAME}-linux-x86_64.tar.gz hackerrank-mcp-${GITHUB_REF_NAME}-linux-x86_64
          sha256sum dist/*.tar.gz > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
